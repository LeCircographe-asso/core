# Umami analytics — standalone stack, independent from the Kamal-managed Rails app.
# Runs alongside the app container on the same VPS but has no coupling with
# the app's SQLite database. Joins Kamal's shared proxy network so
# kamal-proxy can route analytics.<domain> to it with automatic SSL,
# reusing the same proxy that already serves prod + staging.
# See docs/operations/analytics.md for setup.

networks:
  kamal:
    external: true

services:
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - default
      - kamal
    ports:
      # Local-only fallback for direct admin access / debugging.
      # Public access goes through kamal-proxy (see docs/operations/analytics.md).
      - "127.0.0.1:3001:3000"

volumes:
  umami_db_data:
