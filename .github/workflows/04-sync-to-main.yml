name: 🔄 Sync Staging to Main

on:
  workflow_dispatch: # Permet le déclenchement manuel uniquement
    inputs:
      force_sync:
        description: 'Force sync even if there are conflicts'
        required: false
        default: false
        type: boolean

jobs:
  sync-to-main:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Check staging branch status
      run: |
        git fetch origin
        echo "📋 Checking staging branch status..."
        git log --oneline origin/staging -5
        
    - name: Sync staging to main
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Checkout main branch
        git checkout main
        git pull origin main
        
        # Check if there are conflicts
        if ! git merge origin/staging --no-commit --no-ff; then
          if [ "${{ github.event.inputs.force_sync }}" = "true" ]; then
            echo "⚠️ Conflicts detected, but force sync enabled"
            git merge origin/staging --no-edit
          else
            echo "❌ Merge conflicts detected!"
            echo "💡 Use force_sync option or resolve conflicts manually"
            exit 1
          fi
        else
          echo "✅ No conflicts, proceeding with merge"
          git merge origin/staging --no-edit
        fi
        
        # Push to main
        git push origin main
        
    - name: Notify sync completed
      run: |
        echo "🎉 Staging branch synced to main"
        echo "✅ Production deployment will be triggered automatically"
        echo "🏭 Docker image will be built from main branch"
        echo "📊 Production environment will be updated"
