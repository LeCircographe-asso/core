name: ci-docker-build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'bin/**'
              - 'config/**'
              - 'db/**'
              - 'lib/**'
              - 'public/**'
              - 'spec/**'
              - 'Gemfile'
              - 'Gemfile.lock'
              - 'package.json'
              - 'yarn.lock'
              - 'Procfile*'
              - 'tailwind.config.js'
              - 'Dockerfile*'
              - '.rubocop.yml'
              - '.ruby-version'
              - '.node-version'
              - 'config.ru'
              - 'Rakefile'
              - '.github/workflows/**'

  docker-build-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: RUBY_VERSION=4.0.1
          cache-from: type=gha,scope=docker-${{ hashFiles('Gemfile.lock') }}
          cache-to: type=gha,mode=max,scope=docker-${{ hashFiles('Gemfile.lock') }}
