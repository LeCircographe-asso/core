name: 02-tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run unit tests
        run: bundle exec rspec spec/models spec/services --format documentation --out tmp/unit.json
      - name: Upload unit results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tmp/unit.json
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build Tailwind CSS
        run: bundle exec rails tailwindcss:build
      - name: Run integration tests
        run: bundle exec rspec spec/requests spec/routing spec/middleware
      - name: Upload integration results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tmp
          if-no-files-found: warn

  coverage:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run full test suite with coverage
        run: bundle exec rspec
      - name: Verify coverage threshold
        run: |
          COVERAGE=$(ruby -e 'file = "coverage/.last_run.json"; data = File.exist?(file) ? JSON.parse(File.read(file)) : {}; puts(data.fetch("result", {}).fetch("line", 0))' -rjson)
          echo "Coverage line rate: ${COVERAGE}%"
          awk "BEGIN {exit !(${COVERAGE} >= 10)}"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
