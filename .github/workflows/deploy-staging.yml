name: deploy-staging-app

on:
  push:
    branches: [staging]
  # Chaining after deploy-promote-to-staging (GITHUB_TOKEN push does not trigger push workflows).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lecircographe-asso/circographe-staging:${{ github.sha }}
            ghcr.io/lecircographe-asso/circographe-staging:latest
          build-args: RUBY_VERSION=4.0.1
          cache-from: type=gha,scope=docker-${{ hashFiles('Gemfile.lock') }}
          cache-to: type=gha,mode=max,scope=docker-${{ hashFiles('Gemfile.lock') }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      STAGING_SERVER_IP: ${{ vars.STAGING_SERVER_IP }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Update kamal-proxy on host
        run: bundle exec kamal proxy reboot --confirmed -c config/deploy.staging.yml
      - name: Deploy staging with Kamal
        run: bundle exec kamal deploy -c config/deploy.staging.yml --version="$GITHUB_SHA"

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      STAGING_SERVER_IP: ${{ vars.STAGING_SERVER_IP }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Check staging health
        run: |
          for _ in 1 2 3 4 5; do
            if curl -fsS https://staging.lecircographe.fr/up >/dev/null; then
              echo "Staging health check OK"
              exit 0
            fi
            sleep 10
          done
          echo "Staging health check failed after 5 attempts"
          exit 1
      - name: Rollback staging on failure
        if: failure()
        run: bundle exec kamal rollback -c config/deploy.staging.yml
