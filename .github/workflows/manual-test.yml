name: 🧪 Manual Testing

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        bundle install
        npm install
        
    - name: Run tests
      run: |
        bundle exec rails db:create db:migrate
        bundle exec rspec --format progress
        
    - name: Run linting
      run: |
        bundle exec rubocop --format progress
        
    - name: Test summary
      run: |
        echo "✅ Tests terminés avec succès"
        echo "🎯 Environnement testé: ${{ github.event.inputs.environment }}"
        echo "📅 Date: $(date)"
