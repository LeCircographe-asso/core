name: 02 - Auto Merge to Staging

on:
  workflow_run:
    workflows: ["01 - CI & Tests"]
    types:
      - completed
    branches:
      - dev

permissions:
  contents: write
  actions: write

jobs:
  merge-to-staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: dev
        fetch-depth: 0
    
    - name: Configure Git
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
    
    - name: Check if staging needs update
      id: check-branches
      run: |
        # Fetch all branches
        git fetch origin
        
        # Get current dev HEAD
        DEV_HEAD=$(git rev-parse HEAD)
        echo "Dev HEAD: ${DEV_HEAD}"
        
        # Check if staging exists on remote
        if ! git rev-parse --verify origin/staging >/dev/null 2>&1; then
          echo "create_staging=true" >> $GITHUB_OUTPUT
          echo "📦 Staging branch does not exist, will create it"
          exit 0
        fi
        
        # Get staging HEAD
        STAGING_HEAD=$(git rev-parse origin/staging)
        echo "Staging HEAD: ${STAGING_HEAD}"
        
        # Check if staging is behind dev
        if [ "$STAGING_HEAD" != "$DEV_HEAD" ]; then
          echo "needs_update=true" >> $GITHUB_OUTPUT
          echo "📦 Staging branch needs update (behind dev)"
        else
          echo "needs_update=false" >> $GITHUB_OUTPUT
          echo "✅ Staging is already up to date"
        fi
    
    - name: Create or update staging branch
      if: ${{ steps.check-branches.outputs.create_staging == 'true' || steps.check-branches.outputs.needs_update == 'true' }}
      run: |
        # We're already on dev from checkout, fetch to ensure latest
        git fetch origin
        git reset --hard origin/dev
        
        # Create or update staging branch from current dev
        if git rev-parse --verify origin/staging >/dev/null 2>&1; then
          # Staging exists, update it
          git checkout -B staging origin/staging
          git reset --hard origin/dev
        else
          # Staging doesn't exist, create it from dev
          git checkout -B staging
        fi
        
        # Push staging branch
        git push origin staging --force-with-lease
        
        echo "✅ Staging branch updated from dev"
    
    - name: Trigger staging deployment
      if: ${{ steps.check-branches.outputs.create_staging == 'true' || steps.check-branches.outputs.needs_update == 'true' }}
      run: |
        echo "🚀 Triggering staging deployment..."
        curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/03-staging-deploy.yml/dispatches \
          -d '{"ref":"staging"}' || echo "⚠️  Failed to trigger workflow"
    
    - name: Summary
      run: |
        echo "## ✅ Auto-merge Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Source:** dev branch" >> $GITHUB_STEP_SUMMARY
        echo "- **Target:** staging branch" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger:** CI tests passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🚀 Staging deployment triggered automatically"

