name: deploy-promote-to-main

on:
  workflow_dispatch:
    inputs:
      confirm_promote:
        description: "Type PROMOTE to confirm staging -> main promotion"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: ${{ inputs.confirm_promote == 'PROMOTE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure last staging deployment succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list \
            --workflow=deploy-staging.yml \
            --branch=staging \
            --limit=1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "Last deploy-staging conclusion: ${result}"
          if [ "$result" != "success" ]; then
            echo "Last staging deployment did not succeed (got: ${result:-none}). Aborting."
            exit 1
          fi
      - name: Promote staging into main
        run: |
          git checkout main
          git pull --ff-only origin main
          git merge --no-ff origin/staging -m "chore: promote staging to main"
          git push origin main
