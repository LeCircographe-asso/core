name: deploy-promote-to-main

on:
  workflow_dispatch:
    inputs:
      confirm_promote:
        description: "Type PROMOTE to confirm staging -> main promotion"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: deploy-promote-main-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirm_promote == 'PROMOTE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure last staging deployment succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list --repo "${{ github.repository }}" \
            --workflow=deploy-staging.yml \
            --branch=staging \
            --status=completed \
            --limit=1 \
            --json conclusion \
            --jq '(.[0].conclusion) // "missing"')
          echo "Last completed deploy-staging conclusion: ${result}"
          if [ "$result" != "success" ]; then
            echo "Last staging deployment did not succeed (got: ${result:-none}). Aborting."
            exit 1
          fi
      - name: Promote staging into main
        id: merge_main
        run: |
          git checkout main
          git pull --ff-only origin main
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge --no-ff origin/staging -m "chore: promote staging to main"
          git push origin main
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Trigger production deploy and wait for success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          WANT_SHA="${{ steps.merge_main.outputs.main_sha }}"
          if [ -z "$WANT_SHA" ]; then
            echo "::error::main_sha output missing after merge."
            exit 1
          fi
          gh workflow run deploy-production.yml --repo "$REPO" --ref main
          echo "Waiting for deploy-production run for commit ${WANT_SHA}..."
          RUN_ID=""
          for _ in $(seq 1 90); do
            RUN_ID=$(gh run list --repo "$REPO" --workflow=deploy-production.yml \
              --branch=main --limit=30 \
              --json databaseId,headSha,event,status,createdAt \
              --jq "[.[] | select(.headSha == \"$WANT_SHA\")] | sort_by(.createdAt) | reverse | if length > 0 then .[0].databaseId else empty end")
            if [ -n "$RUN_ID" ]; then
              echo "Found deploy-production run id=${RUN_ID}"
              break
            fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::No deploy-production run matched headSha=${WANT_SHA}. Recent runs:"
            gh run list --repo "$REPO" --workflow=deploy-production.yml --branch=main --limit=8 \
              --json databaseId,headSha,event,status,conclusion,url || true
            exit 1
          fi
          echo "Watching deploy-production run $RUN_ID"
          if ! gh run watch "$RUN_ID" --repo "$REPO" --exit-status; then
            RUN_URL=$(gh run view "$RUN_ID" --repo "$REPO" --json url --jq '.url')
            echo "::error::deploy-production failed or was cancelled. Logs: ${RUN_URL}"
            exit 1
          fi
