name: 01 - CI & Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type de test à exécuter'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - tests_only
        - lint_only
        - security_only

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        submodules: false
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.5
        bundler-cache: true
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        bundle install
        npm install
    
    - name: Build Tailwind CSS assets
      if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'tests_only' || github.event.inputs.test_type == '' }}
      run: |
        echo "🎨 Building Tailwind CSS assets..."
        bin/rails tailwindcss:build
        ls -la app/assets/builds/ || echo "No builds directory found"
        
    - name: Run tests
      if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'tests_only' || github.event.inputs.test_type == '' }}
      run: |
        bundle exec rails db:create db:migrate RAILS_ENV=test
        bundle exec rspec --exclude-pattern="spec/disabled/**/*_spec.rb" --format documentation --format json --out tmp/rspec_results.json
    
    - name: Generate coverage report
      if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'tests_only' || github.event.inputs.test_type == '' }}
      run: |
        echo "📊 Coverage Report"
        cat coverage/.last_run.json | grep -A 2 '"result"' || echo "No coverage data"
        
    - name: Check coverage threshold
      if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'tests_only' || github.event.inputs.test_type == '' }}
      run: |
        COVERAGE=$(cat coverage/.last_run.json | grep '"line"' | head -1 | cut -d':' -f2 | tr -d ' ,}')
        echo "Current coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < 10" | bc -l) )); then
          echo "❌ Coverage below 10% threshold! Current: ${COVERAGE}%"
          exit 1
        else
          echo "✅ Coverage meets minimum threshold"
        fi
        
    - name: Run linting
      if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'lint_only' || github.event.inputs.test_type == '' }}
      run: |
        bundle exec rubocop --autocorrect --format progress
        
    - name: Security audit
      if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'security_only' || github.event.inputs.test_type == '' }}
      run: |
        bundle exec bundle audit --update
        
    - name: Test summary
      run: |
        echo "✅ CI completed successfully"
        echo "🎯 Branch: ${{ github.ref_name }}"
        echo "📅 Date: $(date)"