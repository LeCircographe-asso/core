name: 04-deploy-staging

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to current SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  TARGET_SHA: ${{ inputs.sha || github.sha }}

jobs:
  check-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Ensure required CI workflows are green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}/check-runs" > checks.json
          jq -r '.check_runs[] | [.name, .conclusion] | @tsv' checks.json
          for required in "01-lint-audit" "02-tests" "03-docker-build-check"; do
            status=$(jq -r --arg n "$required" '.check_runs[] | select(.name == $n) | .conclusion' checks.json | head -n1)
            if [ "$status" != "success" ]; then
              echo "Required check '$required' is not successful (got: ${status:-missing})"
              exit 1
            fi
          done

  build-push:
    runs-on: ubuntu-latest
    needs: check-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lecircographe-asso/circographe-staging:${{ env.TARGET_SHA }}
            ghcr.io/lecircographe-asso/circographe-staging:latest
          build-args: |
            RUBY_VERSION=4.0.1
          cache-from: type=gha,scope=docker-${{ hashFiles('Gemfile.lock') }}
          cache-to: type=gha,mode=max,scope=docker-${{ hashFiles('Gemfile.lock') }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      - name: Deploy staging with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          STAGING_IMAGE_TAG: ${{ env.TARGET_SHA }}
        run: bundle exec kamal deploy -c config/deploy.staging.yml

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      - name: Check staging health
        run: |
          for _ in 1 2 3 4 5; do
            if curl -fsS https://staging.lecircographe.fr/up >/dev/null; then
              echo "Staging health check OK"
              exit 0
            fi
            sleep 10
          done
          echo "Staging health check failed after 5 attempts"
          exit 1
      - name: Rollback staging on failure
        if: failure()
        run: bundle exec kamal rollback -c config/deploy.staging.yml
