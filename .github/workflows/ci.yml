name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      sqlite3:
        image: sqlite3:latest
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        bundle install
        npm install
        
    - name: Run tests
      run: |
        bundle exec rails db:create db:migrate
        bundle exec rspec
        
    - name: Run linting
      run: |
        bundle exec rubocop
        npm run lint
        
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
    
    - name: Deploy to staging
      env:
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        STAGING_SERVER_IP: ${{ secrets.STAGING_SERVER_IP }}
      run: |
        echo "Deploying to staging environment"
        # Configuration des secrets pour Kamal
        mkdir -p .kamal
        echo "RAILS_MASTER_KEY=$RAILS_MASTER_KEY" > .kamal/secrets
        echo "KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD" >> .kamal/secrets
        # Déploiement avec Kamal
        kamal deploy -c config/deploy.staging.yml
        
  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
    
    - name: Deploy to production
      env:
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        PRODUCTION_SERVER_IP: ${{ secrets.PRODUCTION_SERVER_IP }}
      run: |
        echo "Deploying to production environment"
        # Configuration des secrets pour Kamal
        mkdir -p .kamal
        echo "RAILS_MASTER_KEY=$RAILS_MASTER_KEY" > .kamal/secrets
        echo "KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD" >> .kamal/secrets
        # Déploiement avec Kamal
        kamal deploy -c config/deploy.yml