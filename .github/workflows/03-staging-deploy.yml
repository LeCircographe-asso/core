name: 03 - Staging Deploy

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    
    environment:
      name: staging
      url: https://staging.lecircographe.fr

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        bundle install
        npm install
    
    - name: Quick smoke tests
      run: |
        echo "🧪 Running quick smoke tests..."
        bundle exec rails db:create db:migrate RAILS_ENV=test
        bundle exec rspec spec/models --exclude-pattern="spec/disabled/**/*_spec.rb"
        
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        
    - name: Build Docker image for staging
      run: |
        echo "🐳 Building Docker image for staging..."
        docker build -t ghcr.io/lecircographe-asso/circographe:staging .
        docker push ghcr.io/lecircographe-asso/circographe:staging
        echo "✅ Image pushed successfully"
    
    - name: Setup SSH key
      run: |
        echo "🔐 Setting up SSH key..."
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ vars.STAGING_SERVER_IP }} >> ~/.ssh/known_hosts
        
        # Configure SSH to use the deploy key
        cat >> ~/.ssh/config << EOF
        Host ${{ vars.STAGING_SERVER_IP }}
          IdentityFile ~/.ssh/deploy_key
          StrictHostKeyChecking no
          UserKnownHostsFile ~/.ssh/known_hosts
        EOF
        chmod 600 ~/.ssh/config
        
        # Test SSH connection
        ssh -i ~/.ssh/deploy_key deploy@${{ vars.STAGING_SERVER_IP }} "echo '✅ SSH connection successful'"
        
    - name: Install Kamal
      run: |
        echo "📦 Installing Kamal..."
        gem install kamal
        
    - name: Deploy to staging VPS
      env:
        STAGING_SERVER_IP: ${{ vars.STAGING_SERVER_IP }}
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
        KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      run: |
        echo "🚀 Deploying to staging VPS ($STAGING_SERVER_IP)..."
        
        # Export SSH key path for Kamal
        export SSH_PRIVATE_KEY="$HOME/.ssh/deploy_key"
        
        # Export environment variables for Kamal
        export RAILS_MASTER_KEY="$RAILS_MASTER_KEY"
        export SECRET_KEY_BASE="$SECRET_KEY_BASE"
        export STAGING_PASSWORD="$STAGING_PASSWORD"
        
        # Create .kamal/secrets file for staging
        echo "🔐 Creating Kamal secrets file..."
        mkdir -p .kamal
        echo "RAILS_MASTER_KEY=$RAILS_MASTER_KEY" > .kamal/secrets
        echo "SECRET_KEY_BASE=$SECRET_KEY_BASE" >> .kamal/secrets
        echo "STAGING_PASSWORD=$STAGING_PASSWORD" >> .kamal/secrets
        echo "KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD" >> .kamal/secrets
        
        # Debug: Show secrets file content (without values)
        echo "📋 Secrets file created with $(wc -l < .kamal/secrets) entries:"
        sed 's/=.*/=***/' .kamal/secrets
        
        # Debug: Check Docker and environment
        echo "🐳 Docker info:"
        docker --version
        docker info | head -10
        
        echo "🔍 Environment check:"
        echo "STAGING_SERVER_IP: $STAGING_SERVER_IP"
        echo "SSH_PRIVATE_KEY path: $SSH_PRIVATE_KEY"
        ls -la ~/.ssh/
        
        # Deploy with Kamal (verbose)
        echo "🚀 Starting Kamal deployment..."
        kamal deploy -c config/deploy.staging.yml --verbose
        
    - name: Notify staging deployment
      run: |
        echo "🎉 Staging deployment completed successfully!"
        echo "🌐 Staging URL: https://staging.lecircographe.fr"
        echo "🌐 Direct IP: http://${{ vars.STAGING_SERVER_IP }}:8080"
        echo "📊 You can now test the staging environment"
