name: 03 - Staging Deploy

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    
    environment:
      name: staging
      url: https://staging.lecircographe.fr
    
    env:
      # Enable debug logging for GitHub Actions
      ACTIONS_STEP_DEBUG: true
      ACTIONS_RUNNER_DEBUG: true
      
    steps:
    - name: Validate Environment Variables
      run: |
        echo "🔍 Validating GitHub Variables and Secrets..."
        echo "STAGING_SERVER_IP: ${{ vars.STAGING_SERVER_IP }}"
        echo "PRODUCTION_SERVER_IP: ${{ vars.PRODUCTION_SERVER_IP }}"
        echo "RAILS_MASTER_KEY present: ${{ secrets.RAILS_MASTER_KEY != '' }}"
        echo "SECRET_KEY_BASE present: ${{ secrets.SECRET_KEY_BASE != '' }}"
        echo "SSH_PRIVATE_KEY present: ${{ secrets.SSH_PRIVATE_KEY != '' }}"
        echo "STAGING_PASSWORD present: ${{ secrets.STAGING_PASSWORD != '' }}"
        echo "GITHUB_TOKEN present: ${{ secrets.GITHUB_TOKEN != '' }}"
        echo "GHCR_TOKEN present: ${{ secrets.GHCR_TOKEN != '' }}"
        
        # Validate required variables
        if [ -z "${{ vars.STAGING_SERVER_IP }}" ]; then
          echo "❌ STAGING_SERVER_IP is not set!"
          exit 1
        fi
        
        if [ -z "${{ secrets.RAILS_MASTER_KEY }}" ]; then
          echo "❌ RAILS_MASTER_KEY secret is not set!"
          exit 1
        fi
        
        if [ -z "${{ secrets.SECRET_KEY_BASE }}" ]; then
          echo "❌ SECRET_KEY_BASE secret is not set!"
          exit 1
        fi
        
        if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
          echo "❌ SSH_PRIVATE_KEY secret is not set!"
          exit 1
        fi
        
        echo "✅ All required variables and secrets are present"
        
    - uses: actions/checkout@v6
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.5
        bundler-cache: true
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        bundle install
        npm install
    
    - name: Security audit
      run: |
        echo "🔒 Running security audit..."
        gem install bundler-audit
        bundle audit check --update
        echo "✅ No security vulnerabilities found"
    
    - name: Build Tailwind CSS assets
      run: |
        echo "🎨 Building Tailwind CSS assets..."
        bin/rails tailwindcss:build
        ls -la app/assets/builds/ || echo "No builds directory found"
    
    - name: Run full test suite
      run: |
        echo "🧪 Running full test suite before deployment..."
        bundle exec rails db:create db:migrate RAILS_ENV=test
        bundle exec rspec --exclude-pattern="spec/disabled/**/*_spec.rb" --format json --out tmp/rspec_results.json
        
    - name: Generate coverage report
      run: |
        echo "📊 Coverage Report"
        cat coverage/.last_run.json | grep -A 2 '"result"' || echo "No coverage data"
        
    - name: Check coverage threshold
      run: |
        COVERAGE=$(cat coverage/.last_run.json | grep '"line"' | head -1 | cut -d':' -f2 | tr -d ' ,}')
        echo "Current coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < 40" | bc -l) )); then
          echo "❌ Coverage below 40% threshold! Current: ${COVERAGE}%"
          echo "⚠️  Staging deploy blocked due to low coverage"
          exit 1
        else
          echo "✅ Coverage meets minimum threshold for staging (40%)"
        fi
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
        
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        
    - name: Build and push Docker image for staging
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/lecircographe-asso/circographe-staging:${{ github.sha }}
          ghcr.io/lecircographe-asso/circographe-staging:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          RUBY_VERSION=3.3.5
    
    - name: Setup SSH key
      run: |
        echo "🔐 Setting up SSH key..."
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ vars.STAGING_SERVER_IP }} >> ~/.ssh/known_hosts
        
        # Configure SSH to use the deploy key
        cat >> ~/.ssh/config << EOF
        Host ${{ vars.STAGING_SERVER_IP }}
          IdentityFile ~/.ssh/deploy_key
          StrictHostKeyChecking no
          UserKnownHostsFile ~/.ssh/known_hosts
        EOF
        chmod 600 ~/.ssh/config
        
        # Test SSH connection
        ssh -i ~/.ssh/deploy_key deploy@${{ vars.STAGING_SERVER_IP }} "echo '✅ SSH connection successful'"
        
    - name: Install Kamal
      run: |
        echo "📦 Installing Kamal..."
        gem install kamal
        
    - name: Deploy to staging VPS
      env:
        STAGING_SERVER_IP: ${{ vars.STAGING_SERVER_IP }}
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
        KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      run: |
        echo "🚀 Deploying to staging VPS ($STAGING_SERVER_IP)..."
        
        # === STEP 1: Environment Validation ===
        echo "🔍 STEP 1: Environment Validation"
        echo "STAGING_SERVER_IP: $STAGING_SERVER_IP"
        echo "RAILS_MASTER_KEY length: ${#RAILS_MASTER_KEY}"
        echo "SECRET_KEY_BASE length: ${#SECRET_KEY_BASE}"
        echo "KAMAL_REGISTRY_PASSWORD length: ${#KAMAL_REGISTRY_PASSWORD}"
        echo "STAGING_PASSWORD length: ${#STAGING_PASSWORD}"
        
        # === STEP 2: SSH Configuration ===
        echo "🔐 STEP 2: SSH Configuration"
        export SSH_PRIVATE_KEY="$HOME/.ssh/deploy_key"
        echo "SSH_PRIVATE_KEY path: $SSH_PRIVATE_KEY"
        ls -la ~/.ssh/
        
        # Test SSH connection
        echo "Testing SSH connection..."
        ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o StrictHostKeyChecking=no deploy@$STAGING_SERVER_IP "echo '✅ SSH connection successful'" || echo "❌ SSH connection failed"
        
        # === STEP 3: Docker Environment ===
        echo "🐳 STEP 3: Docker Environment"
        docker --version
        echo "Docker info (first 15 lines):"
        docker info | head -15
        
        # Test Docker buildx
        echo "Testing Docker buildx..."
        docker buildx ls || echo "❌ Docker buildx not available"
        
        # === STEP 4: Kamal Configuration ===
        echo "⚙️ STEP 4: Kamal Configuration"
        echo "Checking Kamal config files..."
        ls -la config/deploy*.yml
        
        echo "Validating staging config..."
        kamal config -c config/deploy.staging.yml || echo "❌ Kamal config validation failed"
        
        # === STEP 5: Secrets Management ===
        echo "🔐 STEP 5: Secrets Management"
        mkdir -p .kamal
        echo "Creating .kamal/secrets file..."
        
        # Create secrets file
        {
          echo "RAILS_MASTER_KEY=$RAILS_MASTER_KEY"
          echo "SECRET_KEY_BASE=$SECRET_KEY_BASE"
          echo "STAGING_PASSWORD=$STAGING_PASSWORD"
          echo "KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD"
        } > .kamal/secrets
        
        echo "Secrets file created with $(wc -l < .kamal/secrets) entries:"
        sed 's/=.*/=***/' .kamal/secrets
        
        # Validate secrets file
        echo "Validating secrets file format..."
        while IFS='=' read -r key value; do
          if [[ -n "$key" && -n "$value" ]]; then
            echo "✅ $key is set"
          else
            echo "❌ $key is missing or empty"
          fi
        done < .kamal/secrets
        
        # === STEP 6: GitHub Container Registry ===
        echo "📦 STEP 6: GitHub Container Registry"
        echo "Testing GHCR login..."
        echo "$KAMAL_REGISTRY_PASSWORD" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || echo "❌ GHCR login failed"
        
        # === STEP 7: Kamal Deploy ===
        echo "🚀 STEP 7: Starting Kamal Deployment"
        echo "Debug environment variables:"
        echo "ACTIONS_STEP_DEBUG: $ACTIONS_STEP_DEBUG"
        echo "ACTIONS_RUNNER_DEBUG: $ACTIONS_RUNNER_DEBUG"
        
        # Export all environment variables for Kamal
        export RAILS_MASTER_KEY="$RAILS_MASTER_KEY"
        export SECRET_KEY_BASE="$SECRET_KEY_BASE"
        export STAGING_PASSWORD="$STAGING_PASSWORD"
        export KAMAL_REGISTRY_PASSWORD="$KAMAL_REGISTRY_PASSWORD"
        
        # Deploy with verbose logging
        kamal deploy -c config/deploy.staging.yml --verbose || {
            echo "❌ Kamal deployment failed!"
            echo "🔍 Checking server logs..."
            ssh -i ~/.ssh/deploy_key deploy@$STAGING_SERVER_IP "docker ps -a" || echo "Cannot connect to server"
            exit 1
          }
        
    - name: Notify staging deployment
      run: |
        echo "🎉 Staging deployment completed successfully!"
        echo "🌐 Staging URL: https://staging.lecircographe.fr"
        echo "🌐 Direct IP: http://${{ vars.STAGING_SERVER_IP }}:8080"
        echo "📊 You can now test the staging environment"
