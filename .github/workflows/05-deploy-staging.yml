name: 🚀 Deploy to Staging

on:
  push:
    branches: [ dev, staging ]
  pull_request:
    branches: [ staging ]

jobs:
  test-staging:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        bundle install
        npm install
        
    - name: Run tests
      run: |
        bundle exec rails db:create db:migrate
        bundle exec rspec --exclude-pattern="spec/disabled/**/*_spec.rb"
        
    - name: Sync dev to staging (if push from dev)
      if: github.ref == 'refs/heads/dev'
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git fetch origin
        git checkout staging
        git merge origin/dev --no-edit
        git push origin staging
        
    - name: Build Docker image for staging
      run: |
        echo "Building Docker image for staging..."
        docker build -t ghcr.io/lecircographe-asso/circographe:staging .
        docker push ghcr.io/lecircographe-asso/circographe:staging
        
    - name: Deploy to staging VPS
      run: |
        echo "Deploying to staging VPS..."
        # Kamal deploy staging
        bundle exec kamal deploy -d staging
        
    - name: Notify staging deployment
      run: |
        echo "🎉 Staging deployment completed successfully!"
        echo "🌐 Staging URL: https://staging.lecircographe.fr"
        echo "📊 You can now test the staging environment"
        if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
          echo "🔄 Auto-deployment from dev branch"
        else
          echo "🔄 Manual deployment from staging branch"
        fi
