name: promote-dev-to-staging

on:
  workflow_dispatch:
    inputs:
      confirm_promote:
        description: "Type PROMOTE to confirm dev -> staging promotion"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: deploy-promote-staging-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirm_promote == 'PROMOTE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure dev CI is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          for required in ci-dev.yml ci-docker-cache.yml; do
            echo "::group::Last completed runs: $required (branch dev)"
            gh run list --repo "$REPO" --workflow="$required" --branch=dev \
              --status=completed --limit=5 \
              --json databaseId,conclusion,event,headBranch,displayTitle,updatedAt
            echo "::endgroup::"
            conclusion=$(gh run list --repo "$REPO" --workflow="$required" --branch=dev \
              --status=completed --limit=1 \
              --json conclusion --jq '(.[0].conclusion) // "missing"')
            echo "Latest completed conclusion for $required on dev: $conclusion"
            if [ "$conclusion" != "success" ]; then
              echo "::error::Required workflow '$required' on dev is not green (got: $conclusion). Merge or push to dev only after CI passes, or fix the failing run on branch dev."
              exit 1
            fi
          done
      - name: Promote dev into staging
        id: merge_staging
        run: |
          git checkout staging
          git pull --ff-only origin staging
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge --no-ff origin/dev -m "chore: promote dev to staging"
          git push origin staging
          echo "staging_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Trigger staging deploy and wait for success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          WANT_SHA="${{ steps.merge_staging.outputs.staging_sha }}"
          if [ -z "$WANT_SHA" ]; then
            echo "::error::staging_sha output missing after merge (merge step failed to set GITHUB_OUTPUT?)."
            exit 1
          fi
          gh workflow run deploy-staging.yml --repo "$REPO" --ref staging
          echo "Waiting for deploy-staging run for commit ${WANT_SHA}..."
          RUN_ID=""
          for _ in $(seq 1 90); do
            # Match the run we just triggered via gh workflow run (push events may exist on staging from manual pushes).
            RUN_ID=$(gh run list --repo "$REPO" --workflow=deploy-staging.yml \
              --branch=staging --limit=30 \
              --json databaseId,headSha,event,status,createdAt \
              --jq "[.[] | select(.headSha == \"$WANT_SHA\" and .event == \"workflow_dispatch\")] | sort_by(.createdAt) | reverse | if length > 0 then .[0].databaseId else empty end")
            if [ -n "$RUN_ID" ]; then
              echo "Found deploy-staging run id=${RUN_ID}"
              break
            fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::No deploy-staging run matched headSha=${WANT_SHA}. Recent runs:"
            gh run list --repo "$REPO" --workflow=deploy-staging.yml --branch=staging --limit=8 \
              --json databaseId,headSha,event,status,conclusion,url || true
            exit 1
          fi
          echo "Watching deploy-staging run $RUN_ID"
          if ! gh run watch "$RUN_ID" --repo "$REPO" --exit-status; then
            RUN_URL=$(gh run view "$RUN_ID" --repo "$REPO" --json url --jq '.url')
            echo "::error::deploy-staging failed or was cancelled. Logs: ${RUN_URL}"
            exit 1
          fi
