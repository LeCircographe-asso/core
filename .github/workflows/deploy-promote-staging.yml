name: deploy-promote-to-staging

on:
  workflow_dispatch:
    inputs:
      confirm_promote:
        description: "Type PROMOTE to confirm dev -> staging promotion"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: deploy-promote-staging-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirm_promote == 'PROMOTE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure dev CI is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for required in "ci-dev.yml" "ci-docker-build.yml"; do
            status=$(gh run list \
              --workflow="$required" \
              --branch=dev \
              --limit=1 \
              --json conclusion \
              --jq '.[0].conclusion')
            echo "Latest ${required} on dev: ${status:-none}"
            if [ "$status" != "success" ]; then
              echo "Required workflow '$required' not successful on dev (got: ${status:-none})"
              exit 1
            fi
          done
      - name: Promote dev into staging
        run: |
          git checkout staging
          git pull --ff-only origin staging
          git merge --no-ff origin/dev -m "chore: promote dev to staging"
          git push origin staging
