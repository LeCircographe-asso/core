name: deploy-promote-to-staging

on:
  workflow_dispatch:
    inputs:
      confirm_promote:
        description: "Type PROMOTE to confirm dev -> staging promotion"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: deploy-promote-staging-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirm_promote == 'PROMOTE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure dev CI is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          for required in ci-dev.yml ci-docker-build.yml; do
            echo "::group::Last completed runs: $required (branch dev)"
            gh run list --repo "$REPO" --workflow="$required" --branch=dev \
              --status=completed --limit=5 \
              --json databaseId,conclusion,event,headBranch,displayTitle,updatedAt
            echo "::endgroup::"
            conclusion=$(gh run list --repo "$REPO" --workflow="$required" --branch=dev \
              --status=completed --limit=1 \
              --json conclusion --jq '(.[0].conclusion) // "missing"')
            echo "Latest completed conclusion for $required on dev: $conclusion"
            if [ "$conclusion" != "success" ]; then
              echo "::error::Required workflow '$required' on dev is not green (got: $conclusion). Merge or push to dev only after CI passes, or fix the failing run on branch dev."
              exit 1
            fi
          done
      - name: Promote dev into staging
        run: |
          git checkout staging
          git pull --ff-only origin staging
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge --no-ff origin/dev -m "chore: promote dev to staging"
          git push origin staging
      - name: Trigger staging deploy (push via GITHUB_TOKEN does not start workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-staging.yml --repo "${{ github.repository }}" --ref staging
