name: deploy-production

on:
  push:
    branches: [main]
  # Same as staging: promote workflows push with GITHUB_TOKEN; dispatch explicitly to run this pipeline.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lecircographe-asso/circographe:${{ github.sha }}
            ghcr.io/lecircographe-asso/circographe:latest
          build-args: RUBY_VERSION=4.0.1
          cache-from: type=gha,scope=docker-${{ hashFiles('Gemfile.lock') }}
          cache-to: type=gha,mode=max,scope=docker-${{ hashFiles('Gemfile.lock') }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy production with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_IMAGE_TAG: ${{ github.sha }}
        run: bundle exec kamal deploy -c config/deploy.production.yml

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Check production health
        run: |
          for _ in 1 2 3 4 5; do
            if curl -fsS https://lecircographe.fr/up >/dev/null; then
              echo "Production health check OK"
              exit 0
            fi
            sleep 15
          done
          echo "Production health check failed after 5 attempts"
          exit 1
      - name: Rollback production on failure
        if: failure()
        run: bundle exec kamal rollback -c config/deploy.production.yml
