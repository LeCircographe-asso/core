name: 🏭 Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        bundle install
        npm install
        
    - name: Run production tests
      run: |
        bundle exec rails db:create db:migrate RAILS_ENV=production
        bundle exec rspec --exclude-pattern="spec/disabled/**/*_spec.rb"
        
    - name: Build Docker image for production
      run: |
        echo "Building Docker image for production..."
        docker build -t ghcr.io/lecircographe-asso/circographe:latest .
        docker build -t ghcr.io/lecircographe-asso/circographe:v$(date +%Y%m%d-%H%M%S) .
        docker push ghcr.io/lecircographe-asso/circographe:latest
        docker push ghcr.io/lecircographe-asso/circographe:v$(date +%Y%m%d-%H%M%S)
        
    - name: Deploy to production VPS
      run: |
        echo "Deploying to production VPS..."
        # Kamal deploy production
        bundle exec kamal deploy -d production
        
    - name: Notify production deployment
      run: |
        echo "🎉 Production deployment completed successfully!"
        echo "🌐 Production URL: https://lecircographe.fr"
        echo "📊 Production environment is now live"
        echo "⚠️ Monitor the application for any issues"
