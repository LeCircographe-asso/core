name: 🧪 01 - Manual Testing

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - quick
        - linting-only

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      if: github.event.inputs.test_type != 'linting-only'
      run: |
        bundle install
        npm install
        
    - name: Run tests
      if: github.event.inputs.test_type != 'linting-only'
      run: |
        bundle exec rails db:create db:migrate
        bundle exec rspec --format progress
        
    - name: Run linting
      run: |
        bundle exec rubocop --format progress
        
    - name: Test summary
      run: |
        echo "✅ Tests terminés avec succès"
        echo "🎯 Type de test: ${{ github.event.inputs.test_type }}"
        echo "📅 Date: $(date)"