name: 02 - Security Auto-Merge

on:
  pull_request:
    branches: [ dev ]
    types: [opened, synchronize, reopened]

jobs:
  security-auto-merge:
    runs-on: ubuntu-latest
    
    # Seulement pour les PRs Dependabot
    if: github.actor == 'dependabot[bot]'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        bundle install
        npm install
    
    - name: Run tests
      run: |
        echo "🧪 Running tests for ${{ github.event.pull_request.title }}"
        bundle exec rails db:create db:migrate
        bundle exec rspec --exclude-pattern="spec/disabled/**/*_spec.rb"
        bundle exec bundle audit --update
    
    - name: Auto-merge Dependabot PR
      if: success()
      uses: fastify/github-action-merge-dependabot@v3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        target: minor
        merge-method: squash
    
    - name: Wait for merge to complete
      run: sleep 10
    
    - name: Auto-sync dev to staging
      if: success()
      run: |
        echo "🔄 Auto-syncing Dependabot update to staging..."
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Fetch latest changes
        git fetch origin
        
        # Checkout staging
        git checkout staging
        git pull origin staging
        
        # Merge dev into staging
        git merge origin/dev --no-edit
        git push origin staging
        
        echo "✅ Dependabot update synced to staging automatically"
    
    - name: Notify Dependabot deployment
      run: |
        echo "🤖 DEPENDABOT UPDATE DEPLOYED"
        echo "============================="
        echo "PR: ${{ github.event.pull_request.title }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Status: Auto-merged and synced to staging"
        echo "Next: Staging deployment will trigger automatically"
