name: 🔄 Dependabot Integration

on:
  push:
    branches: [ deps ]
  pull_request:
    branches: [ deps ]

jobs:
  test-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.5
        bundler-cache: true
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        bundle install
        npm install
        
    - name: Run tests
      run: |
        bundle exec rails db:create db:migrate
        bundle exec rspec --exclude-pattern="spec/disabled/**/*_spec.rb"
        
    - name: Notify dependencies ready
      if: success()
      run: |
        echo "✅ Dependencies updated and tested on deps branch"
        echo "📋 Ready to merge to dev when needed"
        echo "💡 Use 'Sync Dependencies to Dev' workflow to merge manually"
