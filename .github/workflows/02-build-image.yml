name: 🏗️ Build Docker Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build for'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      branch:
        description: 'Branch to build from'
        required: false
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || 'dev' }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/lecircographe-asso/circographe:${{ github.event.inputs.environment }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build summary
      run: |
        echo "✅ Image Docker construite avec succès"
        echo "🏷️  Tag: ${{ github.event.inputs.environment }}"
        echo "🌿 Branch: ${{ github.event.inputs.branch || 'dev' }}"
        echo "📦 Registry: ghcr.io/lecircographe-asso/circographe"
        echo "📅 Date: $(date)"
        echo ""
        echo "💡 Usage:"
        echo "   - staging: Pour tester sur le VPS de staging"
        echo "   - production: Pour déployer en production"
