name: deploy-production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  check-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Ensure required CI workflows are green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" > checks.json
          jq -r '.check_runs[] | [.name, .conclusion] | @tsv' checks.json
          for required in "ci-lint-audit" "ci-tests" "ci-docker-build"; do
            status=$(jq -r --arg n "$required" '.check_runs[] | select(.name == $n) | .conclusion' checks.json | head -n1)
            if [ "$status" != "success" ]; then
              echo "Required check '$required' not successful (got: ${status:-missing})"
              exit 1
            fi
          done

  build-push:
    runs-on: ubuntu-latest
    needs: check-ci
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lecircographe-asso/circographe:${{ github.sha }}
            ghcr.io/lecircographe-asso/circographe:latest
          build-args: RUBY_VERSION=4.0.1
          cache-from: type=gha,scope=docker-${{ hashFiles('Gemfile.lock') }}
          cache-to: type=gha,mode=max,scope=docker-${{ hashFiles('Gemfile.lock') }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      - name: Deploy production with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_IMAGE_TAG: ${{ github.sha }}
        run: bundle exec kamal deploy -c config/deploy.production.yml

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: true
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      - name: Check production health
        run: |
          for _ in 1 2 3 4 5; do
            if curl -fsS https://lecircographe.fr/up >/dev/null; then
              echo "Production health check OK"
              exit 0
            fi
            sleep 15
          done
          echo "Production health check failed after 5 attempts"
          exit 1
      - name: Rollback production on failure
        if: failure()
        run: bundle exec kamal rollback -c config/deploy.production.yml
