# Configuration Kamal pour Staging - VPS Ionos Linux M
service: circographe-staging
image: ghcr.io/lecircographe-asso/circographe:staging

# Serveur VPS Ionos
servers:
  - <%= ENV['STAGING_SERVER_IP'] %>

# Configuration SSH pour Kamal
ssh:
  user: deploy
  key: <%= ENV['SSH_PRIVATE_KEY'] %>

# Variables d'environnement staging
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    RAILS_ENV: staging
    STAGING_MODE: true
    STAGING_AUTH: true
    STAGING_PASSWORD: <%= ENV['STAGING_PASSWORD'] %>
    RAILS_SERVE_STATIC_FILES: true
    SOLID_QUEUE_IN_PUMA: true

# Volumes pour les logs et données
volumes:
  - "circographe_staging_storage:/rails/storage"
  - "/srv/www/lecircographe_staging/log:/app/log"

# Bridge fingerprinted assets
asset_path: /rails/public/assets

# Répertoire de déploiement
destination: /srv/www/lecircographe_staging