# Configuration Kamal pour Staging - VPS Ionos Linux M
service: circographe-staging
image: ghcr.io/lecircographe-asso/circographe:staging

# Serveur VPS Ionos
servers:
  - <%= ENV['STAGING_SERVER_IP'] %>

# Port différent pour éviter les conflits avec production
port: 8080

# Variables d'environnement staging
env:
  RAILS_ENV: staging
  STAGING_MODE: true
  STAGING_AUTH: true
  STAGING_PASSWORD: <%= ENV['STAGING_PASSWORD'] %>
  RAILS_SERVE_STATIC_FILES: true

# Configuration Puma directe (pas de Nginx)
puma:
  threads: 2
  workers: 1
  bind: 0.0.0.0:8080

# Health check
healthcheck:
  path: /health
  port: 8080
  max_attempts: 10
  interval: 10s

# Limites de ressources adaptées au VPS M
limits:
  memory: 256Mi
  cpu: 250m

# Volumes pour les logs
volumes:
  - /var/log/circographe-staging:/app/log

# Configuration SSL avec Let's Encrypt (optionnel)
# ssl:
#   cert_path: /etc/letsencrypt/live/staging.lecircographe.fr/fullchain.pem
#   key_path: /etc/letsencrypt/live/staging.lecircographe.fr/privkey.pem