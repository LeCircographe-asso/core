# Configuration Kamal pour Staging - VPS Ionos Linux M
service: circographe-staging
# org/repo only — registry.server (ghcr.io) prefixes this; avoid ghcr.io/ghcr.io/... in image refs.
image: lecircographe-asso/circographe-staging

# Le conteneur web doit boot vite ; les migrations passent via db:prepare au démarrage.
deploy_timeout: 180

# Serveur VPS Ionos
servers:
  web:
    hosts:
      # Requires STAGING_SERVER_IP (GitHub Actions: vars.STAGING_SERVER_IP; locally: export before kamal)
      - <%= ENV.fetch("STAGING_SERVER_IP") %>

# Configuration SSH pour Kamal
ssh:
  user: deploy

# Credentials for your image host
registry:
  server: ghcr.io
  username: AkaKwak
  password:
    - KAMAL_REGISTRY_PASSWORD

# Proxy configuration pour staging (kamal-proxy avec Let's Encrypt auto)
proxy:
  ssl: true
  host: staging.lecircographe.fr
  app_port: 80  # ← PORT INTERNE de l'app dans le conteneur

# Variables d'environnement staging
env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
  clear:
    RAILS_ENV: staging
    PORT: 80  # ← FORCER Puma à écouter sur port 80
    STAGING_MODE: true
    STAGING_AUTH: true
    STAGING_PASSWORD: <%= ENV.fetch("STAGING_PASSWORD", "") %>
    PUBLIC_REGISTRATION_ENABLED: false
    # Cold start staging = cold start prod : db/seeds.rb ne charge que FAQ, conseil d'administration
    # et partenaires (pas de comptes, pas de catalogue). Le jeu de démo est opt-in via l'alias
    # reset_db_demo (SEED_DEMO=true) ; SEED_LEAN / SEED_POPULATION_COUNT ne servent alors qu'à lui.
    SEED_LEAN: true
    SEED_POPULATION_COUNT: "38"
    RAILS_SERVE_STATIC_FILES: true
    SOLID_QUEUE_IN_PUMA: true
    # Optimisations pour VPS M
    WEB_CONCURRENCY: 0  # ← Single mode (pas de workers)
    JOB_CONCURRENCY: 1
    RAILS_LOG_LEVEL: info

# Alias utiles pour staging volatile : reset manuel quand vous voulez reconstruire les données.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  prepare_db: app exec --reuse "bin/rails db:prepare"
  # Répétition du premier boot prod : schema:load + seeds de contenu seuls. Ensuite : create_super_admin.
  reset_db: app exec --reuse "bin/rails db:reset"
  # Idem avec comptes système (mot de passe 123456) + catalogue + population aléatoire, pour tester l'UX.
  reset_db_demo: app exec --reuse "sh -lc 'SEED_DEMO=true bin/rails db:reset'"
  create_super_admin: app exec --interactive --reuse "bin/rails circographe:create_super_admin"

# La BDD staging reste volatile, mais le reset/seed ne doit plus bloquer le boot du web.

# Volumes pour les logs et données (staging)
volumes:
  - "circographe_staging_storage:/rails/storage"
  - "/srv/www/lecircographe_staging/log:/app/log"
  # rclone.conf temporaire — pour tester en conditions réelles le remote pCloud
  # avant de le brancher en prod (voir docs/backup-restore.md). NightlySnapshotJob
  # ne tourne pas sur staging (garde production? dans le service) : ce montage sert
  # uniquement à des tests manuels `rclone` via `kamal app exec`.
  - "/srv/www/lecircographe_staging/rclone:/home/rails/.config/rclone:ro"

# Bridge fingerprinted assets
asset_path: /rails/public/assets

# Configure the image builder
builder:
  arch: amd64
