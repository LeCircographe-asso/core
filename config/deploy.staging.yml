# Configuration Kamal pour Staging - VPS Ionos Linux M
service: circographe-staging
image: lecircographe-asso/circographe:staging

# Serveur VPS Ionos
servers:
  web:
    hosts:
      - <%= ENV['STAGING_SERVER_IP'] %>

# Configuration SSH pour Kamal
ssh:
  user: deploy

# Credentials for your image host
registry:
  server: ghcr.io
  username: LeCircographe-asso
  password:
    - KAMAL_REGISTRY_PASSWORD

# Proxy configuration pour staging avec Traefik
proxy:
  ssl: true
  host: staging.lecircographe.fr

# Variables d'environnement staging
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    RAILS_ENV: staging
    STAGING_MODE: true
    STAGING_AUTH: true
    STAGING_PASSWORD: <%= ENV['STAGING_PASSWORD'] %>
    RAILS_SERVE_STATIC_FILES: true
    SOLID_QUEUE_IN_PUMA: true
    # Optimisations pour VPS M
    WEB_CONCURRENCY: 2
    JOB_CONCURRENCY: 1
    RAILS_LOG_LEVEL: info

# Volumes pour les logs et données (staging)
volumes:
  - "circographe_staging_storage:/rails/storage"
  - "/srv/www/lecircographe_staging/log:/app/log"

# Bridge fingerprinted assets
asset_path: /rails/public/assets

# Configure the image builder
builder:
  arch: amd64