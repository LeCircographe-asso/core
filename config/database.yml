# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

development_cache:
  <<: *default
  database: storage/development_cache.sqlite3

development_queue:
  <<: *default
  database: storage/development_queue.sqlite3

development_cable:
  <<: *default
  database: storage/development_cable.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  pool: 1
  # Rails 8.1+: db:prepare calls load_seed when the DB is first created (primary DB defaults to seeds?: true).
  # Tests expect an empty DB + transactional fixtures; running db/seeds.rb here breaks isolation and CI.
  seeds: false
  database: <%= Rails.root.join("tmp", "test.sqlite3") %>

test_cache:
  <<: *default
  pool: 1
  database: <%= Rails.root.join("tmp", "test_cache.sqlite3") %>

test_queue:
  <<: *default
  pool: 1
  database: <%= Rails.root.join("tmp", "test_queue.sqlite3") %>

test_cable:
  <<: *default
  pool: 1
  database: <%= Rails.root.join("tmp", "test_cable.sqlite3") %>

# Production : structure imbriquée (primary/cache/queue/cable), exigée par Solid Cache / Solid Queue /
# Solid Cable (config/environments/production.rb, config/cache.yml, config/cable.yml). En structure
# plate (production_cache: au premier niveau), Rails les prend pour des ENVIRONNEMENTS distincts :
# `production` n'aurait alors que `primary` et l'app ne démarrerait pas (« The `queue` database is not
# configured for the `production` environment »). Voir spec/config/database_layout_spec.rb.
# Seule storage/production.sqlite3 (données membres/paiements/cotisations) est répliquée par
# Litestream ; cache/queue/cable sont régénérables depuis db/*_schema.rb par db:prepare.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate

staging:
  <<: *default
  database: storage/staging.sqlite3

staging_cache:
  <<: *default
  database: storage/staging_cache.sqlite3

staging_queue:
  <<: *default
  database: storage/staging_queue.sqlite3

staging_cable:
  <<: *default
  database: storage/staging_cable.sqlite3
