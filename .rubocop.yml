# Rails 8 Omakase baseline + Ezam overrides (non-redundant only)
# Unique rules baseline: rubocop-rails-omakase only (no extra inherit_yaml).
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0.1
  TargetRailsVersion: 8.1.3
  Exclude:
    # Permanent / operational
    - 'bin'
    # Temporary: noisy generated DB Ruby (revisit if we lint migrations selectively)
    - 'db/**/*.rb'
    # Temporary: RuboCop autocorrect can corrupt ERB templates
    - '**/*.erb'
    # Permanent / operational
    - 'vendor/**/*'
    - 'tmp/**/*'
    - '.bundle/**/*'

# Ezam override kept on purpose (not enforced by Omakase)
Layout/EndOfLine:
  EnforcedStyle: lf

# Phase 2 Batch 1 — LOW: Gemfile gem order within groups (non-domain)
Bundler/OrderedGems:
  Enabled: true

# Lot B2 — Omakase disables the Rails department by default except a few test-only
# cops (e.g. AssertNot). We selectively enable high-value Rails cops here; add
# incrementally to avoid churn (see docs/development/testing.md).
Rails/HttpStatus:
  Enabled: true
Rails/Output:
  Enabled: true
Rails/Delegate:
  Enabled: true
Rails/StrongParametersExpect:
  Enabled: true
Rails/PluralizationGrammar:
  Enabled: true
Rails/UniqBeforePluck:
  Enabled: true
