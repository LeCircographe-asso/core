# Rails 8 Omakase baseline + Ezam overrides (non-redundant only)
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0.1
  TargetRailsVersion: 8.1.3
  Exclude:
    - 'bin'
    # temporaly excluded
    - 'db/**/*.rb'
    - '**/*.erb' # rubocop actually break (uglify) template file
    - 'test/**/*.rb'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - '.bundle/**/*'

# Ezam override kept on purpose (not enforced by Omakase)
Layout/EndOfLine:
  EnforcedStyle: lf

# Phase 2 Batch 1 — LOW: Gemfile gem order within groups (non-domain)
Bundler/OrderedGems:
  Enabled: true
